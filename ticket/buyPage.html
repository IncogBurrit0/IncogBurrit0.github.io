<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - Transit App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-black: #000000;
            --card-bg: #000000ff;
            --inner-card-bg: #333333;
            --drawer-bg: #161616;
            --accent-blue: #00a0df;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 2px solid var(--accent-blue);
        }

        .menu-icon {
            width: 25px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            padding: 4px 0;
        }

        .menu-icon span {
            height: 2px;
            background-color: var(--accent-blue);
            width: 100%;
            transition: all 0.3s ease;
        }

        header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 400;
        }

        .refresh-icon {
            color: var(--accent-blue);
            font-size: 20px;
            text-decoration: none;
        }

        /* --- SIDEBAR / POP-OUT MENU STYLES --- */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 998;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            max-width: 80vw;
            height: 100vh;
            background-color: var(--drawer-bg);
            border-right: 1px solid #2a2a2a;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.7);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            display: flex;
            flex-direction: column;
        }

        .side-menu.active {
            transform: translateX(0);
        }

        .side-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #282828;
        }

        .side-menu-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
            color: var(--accent-blue);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .menu-items {
            list-style: none;
            padding: 10px 0;
            margin: 0;
            overflow-y: auto;
        }

        .menu-items li a {
            display: flex;
            align-items: center;
            padding: 16px 22px;
            color: var(--text-white);
            text-decoration: none;
            font-size: 16px;
            border-left: 4px solid transparent;
            transition: background 0.2s, border-left 0.2s, color 0.2s;
        }

        .menu-items li a:hover {
            background-color: #222222;
            color: var(--accent-blue);
        }

        .menu-items li a.active {
            border-left-color: var(--accent-blue);
            background-color: #1f1f1f;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Main Content */
        main {
            padding: 20px;
            flex-grow: 1;
        }

        h2 {
            color: var(--accent-blue);
            font-size: 22px;
            margin-bottom: 25px;
        }

        /* Ticket Card */
        .ticket-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(93, 93, 93, 0.5);
            box-shadow: 0 4px 15px rgba(93, 93, 93, 0.5);
            margin-bottom: 20px;
        }

        .logo-section {
            width: 60px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .go-to-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            box-sizing: border-box;
        }
        .buyTicket {
            width: 40px;
            height: 40px;
            object-fit: contain;
            box-sizing: border-box;
        }

        .ticket-details {
            flex-grow: 1;
            background-color: var(--inner-card-bg);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ticket-type {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 30px;
        }

        /* Button & Timer Section */
        .button-timer-wrapper {
            display: flex;
            overflow: hidden;
            border-radius: 12px;
            height: 50px;
            border: 3px solid #00a0df;
        }

        .view-ticket-btn {
            background-color: var(--bg-black);
            color: var(--text-white);
            border: none;
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 100;
            font-size: 14px;
            cursor: pointer;
        }

        .timer-section {
            background-color: var(--accent-blue);
            color: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .timer-label {
            font-size: 12px;
            text-transform: uppercase;
        }

        .timer-value {
            font-size: 12px;
        }

        /* Footer Button */
        .footer-action {
            padding: 20px;
        }

        .buy-button {
            background-color: var(--accent-blue);
            color: black;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>

    <script>
        // Toggle slide-out menu
        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('menuOverlay');
            sideMenu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function updateTimer() {
            const now = new Date();
            
            // Set the target to 2:00 AM of the NEXT day
            let target = new Date();
            target.setDate(now.getDate() + 1);
            target.setHours(2, 0, 0, 0);

            const diff = target - now;

            // Math to break down milliseconds
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = `${hours} hours`;
        }

        // Run every second
        setInterval(updateTimer, 1000);
        updateTimer(); // Run immediately on load
    </script>
