 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Transit Ticket</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .header-bar {
            height: 40px;
            background-color: #212121;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 15px;
        }

        .close-button {
            background-color: transparent;
            border: none;
            color: #1a73e8;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .main-content {
            padding: 30px 25px;
            text-align: center;
        }

        .metro-transit-title {
            font-size: 28px;
            font-weight: 700;
            color: #333333;
            margin-bottom: -15px;
            text-align: left;
        }

        .show-operator-text {
            font-size: 18px;
            color: #555555;
            margin-bottom: 100px;
            text-align: left;
        }

        /* ------------------------------------ */
        /* --- DUAL RIPPLE ANIMATION STYLES --- */
        /* ------------------------------------ */
        .go-to-logo-container {
            width: 95px;
            height: 95px;
            background-color: #ffffff;
            border: 0px solid #ff7f2a; /* Solid orange border */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 100px auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            
            /* Needed for ripple positioning */
            overflow: visible; 
            position: relative;
            z-index: 1;
        }

    <script>
        // Function to update the time every second
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            const strTime = `${hours}:${minutes}:${seconds} ${ampm}`;
            
            const timeElement = document.getElementById('current-time');
            if (timeElement) {
                timeElement.textContent = strTime;
            }
        }

        // Function to set the expiry date text
        function updateExpiryDate() {
            const now = new Date();
            now.setDate(now.getDate() + 1);
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            const formattedDate = now.toLocaleDateString('en-US', options);
            
            const expiryElement = document.getElementById('ticket-expiry');
            if (expiryElement) {
                expiryElement.textContent = `Expires ${formattedDate} at 2:00 AM`;
            }
        }

        // Update time initially and then every second
        updateTime();
        setInterval(updateTime, 1000);

        // Update the expiry date once on load
        updateExpiryDate();
    </script>
